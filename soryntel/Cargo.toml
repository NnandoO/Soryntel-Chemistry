[workspace]
resolver = "2"
members = [
    "crates/soryntel-core",
    "crates/soryntel-solver",
    "crates/soryntel-thermo",
    "crates/soryntel-db",
    "crates/soryntel-application",
    "crates/soryntel-app",
    "crates/soryntel-desktop",
    "crates/chem_addin_core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Soryntel Chemistry Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
approx = "0.5"

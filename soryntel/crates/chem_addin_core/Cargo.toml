[package]
name = "chem_addin_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Clean-room Rust engine for HSC-style Excel Add-Ins (SQLite + nalgebra + units + thermochemistry)"

[dependencies]
nalgebra = "0.35"
regex = "1.11"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

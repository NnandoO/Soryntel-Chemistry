name: Web (Cloudflare Pages)

# Publica web/ en Cloudflare Pages (dominio: chemistry.soryntel.com).
# Secretos del repositorio necesarios:
#   CLOUDFLARE_API_TOKEN   token con permiso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID de la cuenta de Cloudflare
# Variable opcional del repositorio: CF_PAGES_PROJECT (por defecto soryntel-chemistry).
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  # release.yml la dispara al publicar una versión, para actualizar descargas y tamaños.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build y despliegue
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'soryntel-chemistry' }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Sincronizar descargas con la última versión publicada
        # --soft: si aún no hay versión publicada, se usa src/content/release.json del repositorio.
        run: node scripts/sync-release.mjs --soft
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run lint
      - run: npm run build
      - name: Aviso sin credenciales
        if: env.HAS_CF != 'true'
        run: echo "::warning::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID; se compiló la web pero no se desplegó."
      - name: Crear el proyecto de Pages si no existe
        if: env.HAS_CF == 'true' && github.event_name != 'pull_request'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Desplegar
        if: env.HAS_CF == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # main publica en producción; los PR quedan como vista previa en su rama.
          command: pages deploy out --project-name=${{ env.PROJECT }} --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }} --commit-dirty=true
      - name: Enlace de la vista previa
        if: steps.deploy.outputs.deployment-url != ''
        run: echo "Desplegado en ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"

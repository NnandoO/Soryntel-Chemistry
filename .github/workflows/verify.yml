name: Rust scientific and desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: soryntel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Audit documentation and translation keys
        run: |
          python3 scripts/audit-repository.py
          python3 scripts/audit-architecture.py
      - name: Test all modules including local HTTP transport
        run: cargo test --locked --workspace
      - name: Build desktop
        run: cargo build --locked --release -p soryntel-desktop

name: Build Rust portable packages and deploy
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test --locked --workspace
        working-directory: soryntel
      - run: cargo build --locked --release -p soryntel-desktop
        working-directory: soryntel
      - run: python3 soryntel/packaging/package.py --binary soryntel/target/release/soryntel-desktop --platform linux-x86_64 --output dist
      - name: Verify portable package
        shell: bash
        run: |
          for package in dist/*.tar.gz dist/*.zip; do
            [ -f "$package" ] || continue
            python soryntel/packaging/verify-package.py "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cma-chemistry-linux-packages
          path: dist/*
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --locked --release -p soryntel-desktop
        working-directory: soryntel
      - run: python soryntel/packaging/package.py --binary soryntel/target/release/soryntel-desktop.exe --platform win64 --output dist
      - name: Verify portable package
        shell: bash
        run: |
          for package in dist/*.tar.gz dist/*.zip; do
            [ -f "$package" ] || continue
            python soryntel/packaging/verify-package.py "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cma-chemistry-windows-packages
          path: dist/*
  deploy:
    name: Deploy All Packages to AWS S3
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      AWS_CLOUDFRONT_DIST_ID: ${{ secrets.AWS_CLOUDFRONT_DIST_ID }}

    steps:
      - name: Create dist directory
        run: mkdir -p dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cma-chemistry-linux-packages
          path: dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cma-chemistry-windows-packages
          path: dist

      - name: Inspect Packages
        run: ls -lh dist/

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to AWS S3
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_S3_BUCKET != ''
        run: |
          echo "Subiendo paquetes a s3://${AWS_S3_BUCKET}/releases/ ..."
          aws s3 cp dist/ s3://${AWS_S3_BUCKET}/releases/ --recursive --exclude "*" --include "*.tar.gz" --include "*.deb" --include "*.zip"
          echo "Despliegue a S3 completado con éxito."

      - name: Invalidate CloudFront Cache (Optional)
        if: env.AWS_CLOUDFRONT_DIST_ID != '' && env.AWS_ACCESS_KEY_ID != ''
        run: |
          echo "Invalidando caché de CloudFront para /releases/* ..."
          aws cloudfront create-invalidation --distribution-id ${AWS_CLOUDFRONT_DIST_ID} --paths "/releases/*"
